# Provenance Intelligence System — CI/CD Pipeline
# Triggers: push to main, pull request to main
# Deploys the TanStack Start app to Cloudflare Workers

name: Deploy Provenance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  BUN_VERSION: "1.3"

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: cd app && bun install --frozen-lockfile
        working-directory: app

      - name: Type check
        run: bun run typecheck
        working-directory: app

      - name: Lint
        run: bun run lint
        working-directory: app

  test:
    name: Test
    runs-on: ubuntu-22.04
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: cd app && bun install --frozen-lockfile
        working-directory: app

      - name: Build
        run: bun run build
        working-directory: app

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-22.04
    needs: [quality, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: cd app && bun install --frozen-lockfile
        working-directory: app

      - name: Build
        run: bun run build
        working-directory: app

      - name: Deploy via Higgsfield API
        run: |
          curl -X POST "https://apps-repos.higgsfield.ai/api/websites/${{ secrets.WEBSITE_ID }}/deploy" \
            -H "Authorization: Bearer ${{ secrets.HIGGSFIELD_DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"branch": "main"}'